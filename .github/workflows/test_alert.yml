name: Test Email Alert

on:
  workflow_dispatch: {}   # manual trigger only -- lets you verify the email pipeline works

permissions:
  issues: write

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create test alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Test alert - $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "This is a test alert from your dip-reserve tracker. If you received an email for this, your notification pipeline is working correctly. You can close/delete this issue." \
            --label "test-alert"
